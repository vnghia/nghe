name: "Setup nix environment"
description: "Setup nix environment"
inputs:
  cache-auth-token:
    description: "Cache auth token"
    required: true
  dev-shell:
    description: "Dev shell"
    required: true
  skip-push:
    description: "Skip push"
    required: true
runs:
  using: "composite"
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: "accept-flake-config = true"
    - uses: cachix/cachix-action@v17
      with:
        name: nghe
        authToken: ${{ inputs.cache-auth-token }}
        skipPush: ${{ inputs.skip-push }}
    - name: Build dev shell
      shell: bash
      run: nix develop -i .#${{ inputs.dev-shell }} --command true
